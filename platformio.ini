[env:teensy40]
platform = teensy
board = teensy40
framework = arduino
upload_protocol = teensy-cli
monitor_speed = 115200
# Auto-tune test hook (issue 9): adds a compile-gated serial trigger
# ("tune:test" / "tune:cancel") that simulates the button gestures so the
# capture + tune loop is automatable. Off in production builds; enable for
# bench testing with:
#   PLATFORMIO_BUILD_FLAGS=-DTUNE_TEST_TRIGGER pio run -e teensy40
build_flags =
    -Isrc
    -Isrc/interfaces
    -Isrc/shared
    -Isrc/shared/stft
    -Isrc/shared/pre_estimation
    -Isrc/shared/noise_estimation
    -Isrc/shared/post_estimation
    -Isrc/shared/gain_estimation
    -Isrc/shared/utils
    -Isrc/processors
    -Isrc/processors/denoiser
    -Isrc/processors/adaptivedenoiser
    -Iinclude
    -D__FPU_PRESENT=1
lib_deps =
    adafruit/Adafruit SSD1306@^2.5.7
    adafruit/Adafruit GFX Library@^1.11.9
[env:native]
platform = native
build_src_filter = -<*> +<src/serial_contract.c> +<src/serial_identity.c>
build_flags =
    -Isrc
    -lm
test_framework = unity
